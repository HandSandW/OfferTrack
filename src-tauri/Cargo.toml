[package]
name = "offertrack"
version = "0.1.0"
description = "Offline-first job application tracker"
authors = ["OfferTrack contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.98"
default-run = "offertrack"

[[bin]]
name = "offertrack-cli"
path = "src/bin/offertrack-cli.rs"

[lib]
name = "offertrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
open = "5"
notify = "8"
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
rust_xlsxwriter = "=0.99.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_IO", "Win32_UI_Shell", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
